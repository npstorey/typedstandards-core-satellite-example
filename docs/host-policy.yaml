# docs/host-policy.yaml: what https://core-satellite.typedstandards.org/ displays of the records it serves
# (docs/records.json). This is the host's own rule. It is not signed and not a Typed Standards record, and
# no check verifies it; site/generate.mjs applies it to every record docs/records.json lists.
host: https://core-satellite.typedstandards.org/
# Only records signed by this key and of this type are displayed.
signer: did:key:z6Mkw9jqif2wccYESfNW78Sv2YC2UG1zuN5a5gP1HNL3RxDH
type: content/analysis/v1
# Each record is displayed by the first rule its status and role match.
#   current:   drawn in the map or shown in its section, with a link to typedstandards.org's verifier.
#   version 1: listed as version 1 of the map, with a verifier link; drawn only as below.
#   withdrawn: not drawn; listed under Withdrawn with its date, reason and verifier link.
display:
  - { status: active, roles: [core, map-header, edge], as: current }
  - { status: active, roles: [map-v1], as: version 1 }
  - { status: withdrawn, roles: [core, map-v1, map-header, edge], as: withdrawn }
# The map is drawn from the one current map-header record and the current edge records; two current
# map-header records stop the generator. While no map-header record is current, it is drawn from the
# version-1 record instead.
map:
  from: [map-header, edge]
  otherwise: map-v1
# A served record that no rule matches stops the generator.
unmatched: refuse
# The figure's caption for each ring. `header` takes the ring's definition from the signed map header. Each
# other caption states a relation that every current edge in its ring must have, or the generator refuses:
#   subject-builds-on: typedstandards.org is the subject of a builds-on edge;
#   neither-depends:   the header defines the edge's relation as one in which neither depends on the other.
rings:
  - { ring: 1, caption: Typed Standards builds on these, holds: subject-builds-on }
  - { ring: 2, caption: neither builds on the other, holds: neither-depends }
  - { ring: 3, caption: header }
# Ring 3's nodes are drawn filled or hollow. This is the host's reading of each project's pinned file, not a
# signed statement. A node is filled when its pinned file shows the project publishing signed records, and the
# page quotes the lines that show it. Each entry's location and sha256 must equal the ref the node's current
# edge record gives, or the generator refuses. Every other node in the ring is hollow.
fill:
  ring: 3
  filled: its pinned file shows it publishing signed records
  hollow: no signed records shown in its pinned files
  nodes:
    - id: civicaitools.org
      location: https://raw.githubusercontent.com/npstorey/civic-ai-tools-website/109eecb809a53bd36cc3468c79d243457570a49d/README.md
      sha256: ba16dd52cf07fe369bf6359d22bfe36bae345614179fd14d5e814ac481cde89f
      lines: "26"
      quote: The published registry, and a detail page per analysis carrying its signature, timestamp, and provenance.
    - id: github.com/npstorey/typedstandards-eval-run-example
      location: https://raw.githubusercontent.com/npstorey/typedstandards-eval-run-example/9031a94eebe0d800e52eab6fd4e01c7e788603a6/README.md
      sha256: 3e405213b53a67e9ebffa7e1f332b34ddbbd3c894d6b1c556c8ca25109930529
      lines: "11-12"
      quote: Each record carries its signature, an RFC 3161 timestamp, a Rekor transparency-log inclusion proof and the signing key's registry entry.
