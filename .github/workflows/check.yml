# On every push and pull request, on the Node version docs/verify-output.txt was written on:
#   - the writer rewrites core.md and map/ byte for byte from the committed manifest, and map.yaml is unchanged;
#   - every served record verifies offline, and verify.mjs prints exactly docs/verify-output.txt;
#   - package/build.mjs check rebuilds every record from the build log, and checks the signed files, the
#     served copies in docs/bundles/, the views, the registry and docs/records.json;
#   - docs/index.html equals a fresh generation;
#   - the tests pass.
# Each action is pinned to a full commit SHA, measured with git ls-remote, with its tag in a comment.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact: the first line verify.mjs prints names the Node version, and docs/verify-output.txt
          # was written on 22.23.1.
          node-version: 22.23.1
          package-manager-cache: false
      - run: npm ci
      - name: node corpus/pin.mjs, then no change to core.md, map.yaml or map/
        run: |
          node corpus/pin.mjs
          git diff --exit-code -- core.md map.yaml map
          test -z "$(git status --porcelain -- core.md map.yaml map)"
      - name: node verify.mjs, compared with docs/verify-output.txt
        run: |
          node verify.mjs > "$RUNNER_TEMP/verify-output.txt"
          diff docs/verify-output.txt "$RUNNER_TEMP/verify-output.txt"
      - run: node package/build.mjs check
      - run: npm run check:page
      - run: npm test
